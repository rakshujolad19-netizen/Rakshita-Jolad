<!DOCTYPE html>
<html>
<head>
  <title>Feedback Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h2>Feedback Form</h2>

  <form id="feedbackForm">
    <input type="text" id="name" placeholder="Your Name" required><br><br>
    <input type="email" id="email" placeholder="Your Email" required><br><br>
    <textarea id="message" placeholder="Your Feedback" required></textarea><br><br>
    <button type="submit">Submit Feedback</button>
  </form>

  <p id="statusMessage"></p>

  <script>
    // 🔹 YOUR SUPABASE DETAILS ADDED HERE
    const supabaseUrl = "https://jsopfgirptyfjqhpsyzs.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb3BmZ2lycHR5ZmpxaHBzeXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjQ3NzksImV4cCI6MjA4NjU0MDc3OX0.OrBQBpLSQSB8yd8n8yaVRZohRIjkcqcrXkk7fSoICDs";

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById("feedbackForm");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      const { data, error } = await supabase
        .from("feedback")
        .insert([
          { name: name, email: email, message: message }
        ]);

      if (error) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "❌ Feedback not submitted. Error: " + error.message;
        console.error(error);
      } else {
        statusMessage.style.color = "green";
        statusMessage.innerText = "✅ Feedback submitted successfully!";
        form.reset();
      }
    });
  </script>

</body>
</html>
