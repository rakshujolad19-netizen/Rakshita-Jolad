<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio with Feedback</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#f4efff;
  text-align:center;
  padding:40px;
}
.card{
  background:white;
  padding:30px;
  max-width:500px;
  margin:auto;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
input,textarea{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  background:#7b6cd9;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
button:hover{
  opacity:0.9;
}
#responseMessage{
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>Rakshita Feedback Form 💜</h2>

<div class="card">
<form id="feedbackForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea id="message" placeholder="Your Feedback" required></textarea>
<button type="submit">Submit Feedback</button>
<p id="responseMessage"></p>
</form>
</div>

<script>
const supabaseUrl = "https://jsopfgirptyfjqhpsyzs.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb3BmZ2lycHR5ZmpxaHBzeXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjQ3NzksImV4cCI6MjA4NjU0MDc3OX0.OrBQBpLSQSB8yd8n8yaVRZohRIjkcqcrXkk7fSoICDs";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

document.getElementById("feedbackForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const message = document.getElementById("message").value;
  const response = document.getElementById("responseMessage");

  response.innerText = "Submitting...";

  const { error } = await supabase
    .from("feedback")
    .insert([{ name: name, email: email, message: message }]);

  if(error){
    console.error("Supabase Error:", error);
    response.style.color = "red";
    response.innerText = "❌ Feedback not submitted. Please try again.";
  } else {
    response.style.color = "green";
    response.innerText = "✅ Feedback submitted correctly!";
    document.getElementById("feedbackForm").reset();
  }
});
</script>

</body>
</html>
