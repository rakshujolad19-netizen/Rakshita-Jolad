<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const supabaseUrl = "https://jsopfgirptyfjqhpsyzs.supabase.co";
  const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb3BmZ2lycHR5ZmpxaHBzeXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjQ3NzksImV4cCI6MjA4NjU0MDc3OX0.OrBQBpLSQSB8yd8n8yaVRZohRIjkcqcrXkk7fSoICDs";

  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  const form = document.querySelector("#feedback form");
  const feedbackList = document.getElementById("feedbackList");

  // Submit feedback
  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;

    const { error } = await supabase
      .from("feedback")
      .insert([{ name, email, message }]);

    if (error) {
      alert("Error: " + error.message);
      console.error(error);
      return;
    }

    alert("Feedback submitted successfully!");
    form.reset();
    loadFeedback();
  });

  // Load feedback
  async function loadFeedback() {
    const { data, error } = await supabase
      .from("feedback")
      .select("*");

    if (error) {
      console.error(error);
      return;
    }

    feedbackList.innerHTML = "";

    data.forEach(item => {
      const div = document.createElement("div");
      div.className = "feedback-item";
      div.innerHTML = `<strong>${item.name}</strong><br>${item.message}`;
      feedbackList.appendChild(div);
    });
  }

  loadFeedback();

});
</script>
