<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseUrl = "https://jsopfgirptyfjqhpsyzs.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzb3BmZ2lycHR5ZmpxaHBzeXpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5NjQ3NzksImV4cCI6MjA4NjU0MDc3OX0.OrBQBpLSQSB8yd8n8yaVRZohRIjkcqcrXkk7fSoICDs";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

document.getElementById("feedbackForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formMessage = document.getElementById("formMessage");
  formMessage.style.color = "black";
  formMessage.innerText = "Submitting...";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();

  if (!name || !email || !message) {
    formMessage.style.color = "red";
    formMessage.innerText = "Please fill all fields.";
    return;
  }

  try {
    const { data, error } = await supabase
      .from("feedback")
      .insert([{ name, email, message }]);

    if (error) {
      console.error("Supabase Error:", error);
      formMessage.style.color = "red";
      formMessage.innerText = "Error: " + error.message;
    } else {
      formMessage.style.color = "green";
      formMessage.innerText = "Feedback submitted successfully 🌸";
      document.getElementById("feedbackForm").reset();
    }

  } catch (err) {
    console.error("Unexpected Error:", err);
    formMessage.style.color = "red";
    formMessage.innerText = "Something went wrong!";
  }
});
</script>
