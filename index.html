<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#f4efff,#fff);
  color:#333;
  overflow-x:hidden;
}

/* 🌸 FLOATING PETALS */
.petal{
  position:fixed;
  top:-10%;
  width:18px;
  height:18px;
  background:rgba(183,165,255,0.35);
  border-radius:50% 50% 50% 0;
  transform:rotate(45deg);
  animation:fall linear infinite;
  z-index:-1;
}
@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);opacity:0}
  10%{opacity:1}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  z-index:1000;
}
nav{
  max-width:1100px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav h1{
  font-family:'Playfair Display',serif;
  color:#7b6cd9;
}
nav ul{
  list-style:none;
  display:flex;
  gap:18px;
}
nav ul li a{text-decoration:none;color:#555}
nav ul li a:hover{color:#7b6cd9}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:90px;
  text-align:center;
}
.hero img{
  width:170px;height:170px;
  border-radius:50%;
  border:6px solid #d8d1ff;
  box-shadow:0 15px 30px rgba(123,108,217,.3);
}
.hero h2{
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  margin-top:18px;
  color:#7b6cd9;
}
.hero p{margin:12px 0;color:#666;font-style:italic}

/* SECTIONS */
section{padding:80px 20px}
.container{max-width:1100px;margin:auto}
.section-title{text-align:center;margin-bottom:40px}
.section-title h2{
  font-family:'Playfair Display',serif;
  color:#7b6cd9;
}

/* GRID & CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.3s;
  text-align:center;
}
.card:hover{transform:translateY(-8px)}

/* SKILLS */
.skills span{
  display:inline-block;
  background:#f0edff;
  color:#7b6cd9;
  padding:10px 18px;
  border-radius:30px;
  margin:8px;
  font-size:.9rem;
}

/* CONTACT */
.contact{text-align:center}
.contact a{
  margin:10px;
  display:inline-block;
  padding:15px;
  background:#fff;
  border-radius:50%;
  color:#7b6cd9;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

/* FEEDBACK */
.feedback-form{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.feedback-form input,
.feedback-form textarea{
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:10px;
  border:1px solid #ddd;
  font-family:'Poppins',sans-serif;
}
.feedback-form button{
  width:100%;
  padding:12px;
  background:#7b6cd9;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}
.feedback-form button:hover{
  background:#695bd1;
}

/* FOOTER */
footer{text-align:center;padding:20px;color:#777}
</style>
</head>

<body>

<header>
<nav>
<h1>My Portfolio</h1>
<ul>
<li><a href="#about">About</a></li>
<li><a href="#skills">Skills</a></li>
<li><a href="#cert">Certifications</a></li>
<li><a href="#learning">Learning Journey</a></li>
<li><a href="#projects">Projects</a></li>
<li><a href="#contact">Contact</a></li>
<li><a href="#feedback">Feedback</a></li>
</ul>
</nav>
</header>

<!-- HERO -->
<section class="hero">
<div>
<img src="Profile pic.png">
<h2>Rakshita Jolad</h2>
<p>Growth in technology ✨</p>
</div>
</section>

<!-- CONTACT -->
<section id="contact">
<div class="container">
<div class="section-title"><h2>Get In Touch</h2></div>
<div class="contact">
<a href="#"><i class="fab fa-linkedin-in"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="mailto:rakshita@example.com"><i class="fas fa-envelope"></i></a>
</div>
</div>
</section>

<!-- FEEDBACK SECTION -->
<section id="feedback">
<div class="container">
<div class="section-title"><h2>Feedback</h2></div>
<div class="feedback-form">
<form onsubmit="submitFeedback(event)">
<input type="text" placeholder="Your Name" required>
<input type="email" placeholder="Your Email" required>
<textarea rows="5" placeholder="Write your feedback here..." required></textarea>
<button type="submit">Send Feedback</button>
</form>
</div>
</div>
</section>

<footer>
© 2026 Rakshita Jolad • Lavender Dream 🌸
</footer>

<script>
function submitFeedback(e){
  e.preventDefault();
  alert("Thank you for your valuable feedback 💜");
}
</script>

</body>
</html>
