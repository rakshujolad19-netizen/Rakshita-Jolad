<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakshita Jolad | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#f4efff,#ffffff);
  color:#333;
  overflow-x:hidden;
}
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  z-index:1000;
}
nav{
  max-width:1100px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
nav h1{
  font-family:'Playfair Display',serif;
  color:#7b6cd9;
}
nav ul{
  list-style:none;
  display:flex;
  gap:18px;
}
nav ul li a{
  text-decoration:none;
  color:#555;
}
nav ul li a:hover{
  color:#7b6cd9;
}
.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding-top:90px;
  text-align:center;
}
.hero img{
  width:170px;
  height:170px;
  border-radius:50%;
  border:6px solid #d8d1ff;
  box-shadow:0 15px 30px rgba(123,108,217,.3);
}
.hero h2{
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  margin-top:18px;
  color:#7b6cd9;
}
.hero p{
  margin:12px 0;
  color:#666;
  font-style:italic;
}
section{padding:80px 20px;}
.container{max-width:1100px;margin:auto;}
.section-title{text-align:center;margin-bottom:40px;}
.section-title h2{
  font-family:'Playfair Display',serif;
  color:#7b6cd9;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.3s;
  text-align:center;
}
.card:hover{transform:translateY(-8px);}
.skills span{
  display:inline-block;
  background:#f0edff;
  color:#7b6cd9;
  padding:10px 18px;
  border-radius:30px;
  margin:8px;
  font-size:.9rem;
}
.cert-card{cursor:pointer;}
.cert-card img{
  width:100%;height:180px;object-fit:cover;border-radius:15px;margin-bottom:10px;
}
.cert-card h3{color:#7b6cd9;}
.cert-card small{display:block;margin-top:8px;color:#7b6cd9;font-style:italic;}
.learning-item{position:relative;cursor:pointer;}
.learning-item img{
  width:100%;height:200px;object-fit:cover;border-radius:18px;
}
.learning-item span{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.9);color:#7b6cd9;padding:6px 14px;border-radius:20px;font-size:.85rem;
}
.contact{text-align:center;}
.contact a{
  margin:10px;display:inline-block;padding:15px;background:#fff;border-radius:50%;
  color:#7b6cd9;box-shadow:0 10px 25px rgba(0,0,0,.1);
}
.feedback-form{
  max-width:600px;margin:auto;display:flex;flex-direction:column;gap:15px;
}
.feedback-form input,
.feedback-form textarea{
  padding:12px;border-radius:12px;border:1px solid #ddd;font-family:'Poppins',sans-serif;
}
.feedback-form button{
  padding:12px;border:none;border-radius:25px;background:#7b6cd9;color:#fff;font-weight:600;cursor:pointer;
}
.feedback-form button:hover{background:#5f52b5;}
.modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  justify-content:center;align-items:center;z-index:2000;
}
.modal-content{
  background:#fff;padding:25px;border-radius:20px;max-width:700px;width:90%;text-align:center;
}
.modal-content img{width:100%;border-radius:15px;margin-bottom:15px;}
footer{text-align:center;padding:20px;color:#777;}
</style>
</head>

<body>

<!-- Content remains SAME as yours until feedback section -->

<section id="feedback">
<div class="container">
<div class="section-title"><h2>Feedback</h2></div>

<form id="feedbackForm" class="feedback-form">
<input type="text" id="name" placeholder="Your Name" required>
<input type="email" id="email" placeholder="Your Email" required>
<textarea id="message" rows="5" placeholder="Your Feedback..." required></textarea>
<button type="submit">Submit Feedback</button>
</form>

</div>
</section>

<footer>
© 2026 Rakshita Jolad • Lavender Dream 🌸
</footer>

</body>
</html>
